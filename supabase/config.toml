project_id = "konam"

[db]
major_version = 17

[db.seed]
enabled = false

# These public endpoints check the app key in the handler. It is a capability,
# not a user credential; service writes have separate service-role-only grants.
[functions.companion]
verify_jwt = false
[functions.site-analytics]
verify_jwt = false
[functions.newsletter-subscribe]
verify_jwt = false

# Local CI exercises the same confirmed-email flow as hosted Auth, using Mailpit.
[auth]
site_url = "http://127.0.0.1:8748"
additional_redirect_urls = ["https://joaoccaldas.github.io/konam/index.html"]
minimum_password_length = 12
[auth.email]
enable_confirmations = true
max_frequency = "1s"
