<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kona.m · Beast Cave prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.brand{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));letter-spacing:.18em;font-size:14px}
.badge{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));padding:9px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(10,10,10,.55);backdrop-filter:blur(14px);font-size:11px;letter-spacing:.12em}
.help{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));max-width:360px;padding:13px 15px;background:rgba(10,10,10,.62);border:1px solid rgba(255,255,255,.12);border-radius:14px;backdrop-filter:blur(14px);font-size:12px;line-height:1.45}
#inspect{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));max-width:300px;padding:13px 15px;background:rgba(10,10,10,.72);border:1px solid rgba(255,106,42,.40);border-radius:14px;backdrop-filter:blur(14px);font-size:12px;line-height:1.45;display:none}
#inspect b{display:block;color:#ff6a2a;letter-spacing:.08em;margin-bottom:5px}
button{pointer-events:auto;background:#eee;color:#111;border:0;border-radius:999px;padding:10px 14px;font-weight:700;margin-top:8px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "/web/node_modules/three/build/three.module.js",
    "three/": "/web/node_modules/three/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div class="brand">KONA.M · LIONEL'S CAVE</div>
  <div class="badge">PROTOTYPE · UNWIRED</div>
  <div class="help">
    Drag to look · scroll/pinch to move · click objects to inspect.<br>
    <button id="overview">Overview</button>
    <button id="trainer">The Machine</button>
  </div>
  <div id="inspect"><b id="inspectTitle"></b><span id="inspectBody"></span></div>
</div>
<script type="module" src="/web/src/rooms/beast-cave-preview.js"></script>
</body>
</html>
