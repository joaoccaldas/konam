name: Import Canyon Museum snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-canyonmuseum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'joaoccaldas/konam'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 856b98f0d9392c48ef7a6ff0fedaa39d459ef14c
      TARGET_BRANCH: migration/m0-equivalence-20261002
    steps:
      - name: Checkout Kona.m bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Canyon Museum baseline
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/joaoccaldas/canyonmuseum.git /tmp/canyonmuseum
          cd /tmp/canyonmuseum
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Build behavior-equivalent snapshot branch
        run: |
          set -euo pipefail
          git config user.name "Kona.m Migration Bot"
          git config user.email "actions@users.noreply.github.com"

          git switch -C "$TARGET_BRANCH"

          # Copy the exact source tree including large binary assets, but leave the
          # target workflow directory untouched. GitHub's GITHUB_TOKEN cannot create
          # or update workflow files because it lacks the separate workflows
          # permission. Those files are replayed afterward through the connected
          # GitHub integration, which does have workflow-write capability.
          rsync -a --delete             --exclude '.git/'             --exclude '.github/workflows/'             /tmp/canyonmuseum/ ./

          mkdir -p docs/migration
          cat > docs/migration/M0_SOURCE.json <<EOF
          {
            "source_repository": "joaoccaldas/canyonmuseum",
            "source_sha": "$SOURCE_SHA",
            "target_repository": "joaoccaldas/konam",
            "strategy": "exact-tree snapshot excluding workflows; workflows replayed separately",
            "history_policy": "source repository remains immutable historical history; target records exact source SHA"
          }
          EOF

          git add -A
          git commit -m "migration: import Canyon Museum M0 baseline $SOURCE_SHA"
          git push --force origin "$TARGET_BRANCH"

      - name: Report imported branch
        run: |
          git rev-parse HEAD
          git status --short
