name: Visual evidence V2
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/styles/**'
      - 'web/landing.template.html'
      - 'museum/**'
      - 'assets/**'
      - 'tools/build_pages.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        viewport: [320, 360, 390, 430, landscape-phone, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node tools/build_pages.mjs
      - run: git diff --exit-code -- app '*.html' web/dist
      - name: Start local site
        run: |
          python3 -m http.server 8754 > /tmp/kona-http.log 2>&1 &
          echo $! > /tmp/kona-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8754/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture visual matrix
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUDIT_VIEWPORT: ${{ matrix.viewport }}
        run: |
          node web/visual-evidence-v2.mjs http://127.0.0.1:8754/ visual-evidence-v2
          node tools/score-visual-evidence.mjs visual-evidence-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence-v2-${{ matrix.viewport }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence-v2/
          retention-days: 14
