<body>
<canvas id="stage" aria-label="3D studio: drag to turn the bike, pinch or scroll to zoom"></canvas>
<div class="letter t"></div><div class="letter b"></div>
<header class="bar">
  <a class="pill keep" href="index.html?view=me" aria-label="Back to User Studio">← <span class="brand">USER STUDIO</span></a>
  <span class="pill event" id="eventPill" hidden></span>
  <span class="grow"></span>
  <button class="pill" id="shareBtn" aria-label="Share this bike">Share</button>

</header>
<div class="hero" id="hero"><small id="heroEyebrow"></small><h1 id="heroTitle">Studio</h1><p id="heroSub"></p></div>

<div class="fab">

  <button id="favBtn" aria-pressed="false" aria-label="Save to favourites" title="Favourite">♡</button>
  <button id="dockBtn" aria-label="Show or hide the panel" title="Panel">≡</button>
</div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="bikes" aria-selected="true">Bikes</button>
    <button role="tab" data-tab="setup">Setup</button>

</section>
