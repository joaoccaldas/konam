name: M1 deterministic generated sync

on:
  push:
    branches:
      - migration/m1-konam-identity-20261002
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/m1-konam-identity-20261002
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deterministic web dependencies
        run: npm ci --ignore-scripts --prefix web

      - name: Rebuild canonical generated outputs
        run: node tools/build_pages.mjs

      - name: Commit generated deltas
        run: |
          set -euo pipefail
          git config user.name "Kona.m Build Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated deltas."
            exit 0
          fi
          git commit -m "build: sync Kona.m M1 deterministic outputs"
          git push origin HEAD:migration/m1-konam-identity-20261002
