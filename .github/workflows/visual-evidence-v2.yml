name: Visual evidence V2
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/styles/**'
      - 'web/landing.template.html'
      - 'museum/**'
      - 'assets/**'
      - 'tools/build_pages.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        viewport: [320, 360, 390, 430, landscape-phone, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node tools/build_pages.mjs
      - run: git diff --exit-code -- app '*.html' web/dist
      - name: Start local site
        run: |
          python3 -m http.server 8754 > /tmp/kona-http.log 2>&1 &
          echo $! > /tmp/kona-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8754/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture visual matrix
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUDIT_VIEWPORT: ${{ matrix.viewport }}
        run: |
          node web/visual-evidence-v2.mjs http://127.0.0.1:8754/ visual-evidence-v2
          node tools/score-visual-evidence.mjs visual-evidence-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence-v2-${{ matrix.viewport }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence-v2/
          retention-days: 14

  beast-cave:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Build Beast Cave production-candidate review
        run: node tools/build_beast_cave_review.mjs
      - name: Start exact review surface
        run: |
          python3 -m http.server 8755 > /tmp/beast-http.log 2>&1 &
          echo $! > /tmp/beast-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8755/review/beast-cave/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/beast-http.log
          exit 1
      - name: Capture real Beast Cave geometry angles
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node web/beast-cave-evidence.mjs http://127.0.0.1:8755/review/beast-cave/
      - name: Capture immersive Beast Cave experience
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node web/beast-cave-experience-evidence.mjs http://127.0.0.1:8755/experiences/beast-cave/ beast-cave-experience-evidence
      - name: Verify immersive experience evidence
        run: |
          test -f beast-cave-experience-evidence/desktop-01-entry.png
          test -f beast-cave-experience-evidence/desktop-02-room.png
          test -f beast-cave-experience-evidence/desktop-03-machine-story.png
          test -f beast-cave-experience-evidence/mobile-01-entry.png
          test -f beast-cave-experience-evidence/mobile-03-story.png
          node -e "const a=require('./beast-cave-experience-evidence/desktop-errors.json'); const b=require('./beast-cave-experience-evidence/mobile-errors.json'); if(a.length||b.length){console.error({desktop:a,mobile:b});process.exit(1)}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beast-cave-production-experience-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/evidence/beast-cave/
            beast-cave-experience-evidence/
          retention-days: 14
