name: Sync public certification artifacts

on:
  push:
    branches:
      - fix/launch-readiness-critical
    paths:
      - .github/workflows/sync-public-certification.yml
      - tools/scan_public_surface.mjs
      - tools/harden_pages.mjs
      - web/landing.template.html
      - web/src/**
      - web/styles/**
      - manifest.webmanifest
      - privacy.html

permissions:
  contents: write

concurrency:
  group: sync-public-certification
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-readiness-critical
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Rebuild, seal and privacy-scan public site
        env:
          PUBLIC_SITE_URL: https://joaoccaldas.github.io/konam/
        run: |
          node tools/build_pages.mjs
          node tools/build_app.mjs
          bash tools/stage_site.sh
      - name: Commit deterministic tracked artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "build: refresh privacy and SEO certified public bundle"
          git push origin HEAD:fix/launch-readiness-critical
