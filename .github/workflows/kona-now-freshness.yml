name: KONA Now freshness

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/kona-now-freshness.yml'
      - 'tools/refresh_companion.ts'
      - 'tools/build_intern_brief.mjs'
      - 'web/src/ui/companion-data.js'
      - 'tools/check_companion_freshness.mjs'
      - 'integrations/companion/sources.json'
      - 'supabase/functions/companion/**'
      - 'web/src/cloud/supabase-lite.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kona-now-freshness.yml'
      - 'tools/refresh_companion.ts'
      - 'tools/build_intern_brief.mjs'
      - 'web/src/ui/companion-data.js'
      - 'tools/check_companion_freshness.mjs'
      - 'integrations/companion/sources.json'
      - 'supabase/functions/companion/**'
      - 'web/src/cloud/supabase-lite.js'

permissions:
  contents: read

concurrency:
  group: kona-now-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe live KONA Now sources
        run: node tools/check_companion_freshness.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare dated Companion snapshot
        run: deno run --allow-net --allow-read --allow-write tools/refresh_companion.ts
      - name: Build reviewable Intern editions
        run: node tools/build_intern_brief.mjs
      - name: Keep snapshot and editions for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: intern-source-digest
          path: |
            output/intern/
            integrations/companion/feed.json
            integrations/companion/rss.xml
          retention-days: 14
