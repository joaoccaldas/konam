<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">\n<link rel="icon" href="data:,">\n<link rel="stylesheet" href="/brand/typography.css">
<title>Kona.m · Lionel Sanders Beast Cave review</title>
<style>
:root{--lava:#ff6a2a;--ink:#0b0b0b;--paper:#eee5d9}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Manrope,Arial,sans-serif}
#stage{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.brand{font-weight:650;position:absolute;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));letter-spacing:.20em;font-size:13px}
.badge{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));padding:9px 12px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(10,10,10,.55);backdrop-filter:blur(14px);font-size:11px;letter-spacing:.12em}
.help{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));max-width:430px;padding:13px 15px;background:rgba(10,10,10,.62);border:1px solid rgba(255,255,255,.12);border-radius:14px;backdrop-filter:blur(14px);font-size:12px;line-height:1.45}
#inspect{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));max-width:320px;padding:13px 15px;background:rgba(10,10,10,.72);border:1px solid rgba(255,106,42,.40);border-radius:14px;backdrop-filter:blur(14px);font-size:12px;line-height:1.45;display:none}
#inspect b{display:block;color:var(--lava);letter-spacing:.08em;margin-bottom:5px}
button{pointer-events:auto;background:rgba(238,229,217,.94);color:#111;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 14px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.18);margin-top:8px;margin-right:5px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div class="brand">KONA.M · LIONEL'S CAVE</div>
  <div class="badge">PRIVATE ROOM · REVIEW BUILD</div>
  <div class="help">
    Drag to look · scroll/pinch to move · click objects to inspect.<br>
    <button id="overview">Overview</button>
    <button id="trainer">The Machine</button>
    <button id="runlab">Run Lab</button>
    <button id="gallery">Iterations</button>
    <button id="gear">Gear</button>
    <button id="kona">Kona Horizon</button>
  </div>
  <div id="inspect"><b id="inspectTitle"></b><span id="inspectBody"></span></div>
</div>
<script src="./beast-cave-review.bundle.js"></script>
</body>
</html>
