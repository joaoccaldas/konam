name: Publish Kona.m public site

on:
  push:
    branches:
      - launch/public-surface-certification-20261002
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: konam-public-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout hardened source
        uses: actions/checkout@v4

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      - name: Build hardened public surface
        env:
          PUBLIC_SITE_URL: https://joaoccaldas.github.io/konam/
        run: |
          node tools/build_pages.mjs
          bash tools/stage_site.sh

      - name: Leak guard
        run: |
          if grep -rIlE '/Users/[a-z]+|/home/[a-z]+/|[A-Za-z0-9._%+-]{1,64}@(gmail|hotmail|outlook|icloud|yahoo)\.com|(^|[^A-Za-z0-9+/])(sk-[A-Za-z0-9]{20,80}|ghp_[A-Za-z0-9]{30,80}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35})([^A-Za-z0-9+/]|$)|demandware|cloudflareinsights' _site; then
            echo "::error::private or third-party content in public bundle"
            exit 1
          fi

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
