<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071116">
<title>Kona.m · NOR // 3 Norwegian Engine review</title>
<style>
:root{--bg:#071116;--surface:#0d1920;--ink:#f5f3ee;--muted:#b4c0c8;--line:rgba(238,247,250,.13);--accent:#ff6a22;--ocean:#39c8ef}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
.brand{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.badge{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(7,17,22,.60);backdrop-filter:blur(14px);font-size:11px;font-weight:700;letter-spacing:.12em}
.help{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));max-width:min(620px,calc(100vw - 40px));padding:13px 15px;background:rgba(7,17,22,.67);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);font-size:12px;line-height:1.45}
.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{pointer-events:auto;background:var(--ink);color:var(--bg);border:0;border-radius:999px;min-height:44px;padding:9px 13px;font-weight:750}
button:hover{background:var(--accent)}
#inspect{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));max-width:330px;padding:13px 15px;background:rgba(7,17,22,.76);border:1px solid rgba(57,200,239,.36);border-radius:14px;backdrop-filter:blur(14px);font-size:12px;line-height:1.5;display:none}
#inspect b{display:block;color:var(--ocean);letter-spacing:.08em;margin-bottom:5px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(7,17,22,.96),rgba(7,17,22,.82));pointer-events:auto;z-index:3;transition:opacity .35s ease}
#loading.hidden{opacity:0;pointer-events:none}
#loading div{text-align:center;max-width:340px;padding:24px}
#loading strong{display:block;font-family:Georgia,serif;font-size:30px;font-weight:400;margin-bottom:8px}
#loading span{color:var(--muted);font-size:12px;line-height:1.5}
#error{color:#ffc7b1;display:none;margin-top:10px}
@media(max-width:700px){.badge{top:58px;left:max(20px,env(safe-area-inset-left));right:auto}.help{right:max(20px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));font-size:11px}.help>span{display:none}#inspect{left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));bottom:150px;max-width:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div class="brand">KONA.M · NOR // 3</div>
  <div class="badge">PRODUCTION CANDIDATE · UNWIRED</div>
  <div id="loading"><div><strong>The Norwegian Engine</strong><span>Loading wet basalt, three rails and one very controlled amount of suffering.</span><span id="error"></span></div></div>
  <div class="help"><span>Drag to look · scroll/pinch to move · tap objects to inspect.</span><div class="buttons">
    <button id="overview">Overview</button><button id="lanes">Three Rails</button><button id="protocol">Protocol</button><button id="altitude">Altitude</button><button id="vault">Podium Vault</button><button id="fjord">Fjord Wall</button><button id="kona">Kona Line</button>
  </div></div>
  <div id="inspect"><b id="inspectTitle"></b><span id="inspectBody"></span></div>
</div>
<script type="module">
window.addEventListener('error',e=>{const el=document.getElementById('error');if(el){el.style.display='block';el.textContent='Render error: '+(e.message||'unknown error')}});
try{
  await import('../../web/src/rooms/norwegian-engine-preview.js');
  const ready=()=>{if(window.__NOR_ENGINE_RENDER_READY){document.getElementById('loading')?.classList.add('hidden');return}requestAnimationFrame(ready)};
  ready();
}catch(err){
  const el=document.getElementById('error');if(el){el.style.display='block';el.textContent='Could not load 3D review: '+err.message}
  console.error(err);
}
</script>
</body>
</html>
