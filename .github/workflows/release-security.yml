name: Release security gate

on:
  push:
    branches:
      - release/kona-beta-source-rc-20260930
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Scan source for secrets and private data
        run: node tools/scan_private_data.mjs

  web-dependencies:
    name: Web dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Audit complete dependency graph
        run: npm audit --audit-level=high
        working-directory: web

  android-dependencies:
    name: Android shell dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/native/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app/native
      - name: Audit complete dependency graph
        run: npm audit --audit-level=high
        working-directory: app/native
      - name: Verify native build-tool compatibility
        working-directory: app/native
        run: |
          npm ci --prefix ../../web --ignore-scripts
          npm run sync
          npm run icons
      - name: Verify packaged entry layout
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8762 --bind 127.0.0.1 --directory app/native/www >/tmp/kona-native-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8762/ >/dev/null && break; sleep .5; done
          node web/native-entry-layout-browser.mjs http://127.0.0.1:8762/

  supabase-replay:
    name: Supabase replay and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Replay migrations in a clean local Supabase
        run: |
          supabase start
          supabase db reset --local
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/security.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/newsletter.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real Auth registration, confirmation, login, recovery and refresh
        run: |
          supabase status -o env > "$RUNNER_TEMP/konam-auth.env"
          node web/account-auth-backend.mjs "$RUNNER_TEMP/konam-auth.env"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge handler and stream boundary tests
        run: deno test --lock=supabase/functions/deno.lock --frozen --allow-read --allow-env supabase/functions/_shared/request_test.ts supabase/functions/companion/handler_test.ts supabase/functions/companion/providers_test.ts supabase/functions/site-analytics/handler_test.ts supabase/functions/newsletter-subscribe/handler_test.ts
