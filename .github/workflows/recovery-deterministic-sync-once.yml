name: Recovery deterministic sync once
on:
  push:
    branches: [recovery/final-rooms-20261004]
    paths: [.github/workflows/recovery-deterministic-sync-once.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/final-rooms-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Rebuild canonical generated outputs
        run: |
          node tools/build_pages.mjs
          node tools/build_app.mjs
          git status --short
      - name: Commit deterministic sync and remove this workflow
        run: |
          rm .github/workflows/recovery-deterministic-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app sw.js index.html web/dist
          git add -u .github/workflows/recovery-deterministic-sync-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync recovered rooms deterministically"
          git push origin HEAD:recovery/final-rooms-20261004
