name: Publish Kona.m public site

on:
  push:
    branches:
      - launch/public-surface-certification-20261002
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: konam-public-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout hardened source
        uses: actions/checkout@v4

      - name: Wait for certification of this exact source SHA
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['checks.yml','app-seal.yml','release-security.yml','integration-contract.yml','visual-evidence-v2.yml','ui-interaction-audit.yml'];
            const deadline = Date.now() + 25 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            while (true) {
              const pending = [];

              for (const workflow_id of required) {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...context.repo,
                  workflow_id,
                  head_sha: context.sha,
                  per_page: 100
                });
                const runs = data.workflow_runs
                  .filter(r => r.head_sha === context.sha)
                  .sort((a,b) => b.id - a.id);

                const success = runs.find(r => r.status === 'completed' && r.conclusion === 'success');
                if (success) {
                  core.info(`${workflow_id}: certified by ${success.html_url}`);
                  continue;
                }

                const active = runs.find(r => r.status !== 'completed');
                if (active) {
                  pending.push(`${workflow_id}:${active.status}`);
                  continue;
                }

                if (runs.length) {
                  const latest = runs[0];
                  core.setFailed(`${workflow_id} completed without a successful certification for ${context.sha}: ${latest.conclusion || latest.status} (${latest.html_url})`);
                  return;
                }

                pending.push(`${workflow_id}:not-started`);
              }

              if (!pending.length) {
                core.info(`All required workflows certified ${context.sha}`);
                break;
              }

              if (Date.now() >= deadline) {
                core.setFailed(`Timed out waiting for exact-SHA certification of ${context.sha}: ${pending.join(', ')}`);
                return;
              }

              core.info(`Waiting for exact-SHA certification: ${pending.join(', ')}`);
              await sleep(15000);
            }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      - name: Build hardened public surface
        env:
          PUBLIC_SITE_URL: https://joaoccaldas.github.io/konam/
        run: |
          node tools/build_pages.mjs
          node tools/build_app.mjs
          bash tools/stage_site.sh

      - name: Leak guard
        run: |
          if grep -rIlE '/Users/[a-z]+|/home/[a-z]+/|[A-Za-z0-9._%+-]{1,64}@(gmail|hotmail|outlook|icloud|yahoo)\.com|(^|[^A-Za-z0-9+/])(sk-[A-Za-z0-9]{20,80}|ghp_[A-Za-z0-9]{30,80}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35})([^A-Za-z0-9+/]|$)|demandware|cloudflareinsights' _site; then
            echo "::error::private or third-party content in public bundle"
            exit 1
          fi

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
